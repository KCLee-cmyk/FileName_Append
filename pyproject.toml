[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "filesuffix"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.5"]

[project.scripts]
filesuffix = "filesuffix.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
